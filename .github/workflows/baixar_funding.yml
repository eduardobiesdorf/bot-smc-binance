name: Baixar o histórico de funding

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2020-01'

permissions:
  contents: read

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Data de hoje
        id: dia
        run: echo "d=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - name: Cache dos klines
        uses: actions/cache@v4
        with:
          path: dados_universo
          key: universo-${{ inputs.inicio || '2020-01' }}-${{ steps.dia.outputs.d }}
          restore-keys: |
            universo-${{ inputs.inicio || '2020-01' }}-
      - name: Cache do funding
        id: cf
        uses: actions/cache@v4
        with:
          path: dados_funding
          key: funding-${{ inputs.inicio || '2020-01' }}-${{ steps.dia.outputs.d }}
          restore-keys: |
            funding-${{ inputs.inicio || '2020-01' }}-
      - name: Baixar
        env:
          THREADS: '12'
        run: |
          set -o pipefail
          python -u baixar_funding.py --pasta dados_funding \
            --inicio ${{ inputs.inicio || '2020-01' }} 2>&1 | tee funding.log
      - name: O que tem
        run: |
          ls dados_funding | wc -l
          du -sh dados_funding
      - name: Resumo
        if: always()
        run: |
          { echo '```'; cat funding.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
