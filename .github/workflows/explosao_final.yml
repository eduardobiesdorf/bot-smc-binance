name: "pesquisa · Explosão final (universo cripto inteiro)"

# Baixa todos os pares USDT de futuros e roda a configuracao escolhida:
# vela unica em H8, filtros de RSI e extensao, alvo no topo da vela mais
# 90% do tamanho dela. Abre mes a mes e por faixa de volume. O dado nao
# entra no repositorio.

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2025-01'
      tf:
        description: 'Tempos gráficos, em horas, separados por vírgula'
        required: false
        default: '8,4,1'
      alvo:
        description: 'Alvo: fração do tamanho da vela além do topo dela'
        required: false
        default: '0.9'
      faixas:
        description: 'Em quantas faixas de volume dividir as moedas'
        required: false
        default: '4'
      threads:
        description: 'Downloads em paralelo'
        required: false
        default: '16'

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Baixar o universo inteiro em 1h
        env:
          BAIXAR_THREADS: ${{ inputs.threads || '16' }}
        run: |
          set -o pipefail
          python -u baixar_futuros.py \
            --inicio ${{ inputs.inicio || '2025-01' }} \
            --intervalo 1h --top 9999 --pasta dados_universo 2>&1 | tail -5
          echo "pares baixados: $(ls dados_universo | wc -l)"

      - name: Rodar a configuração escolhida
        run: |
          set -o pipefail
          for TF in $(echo "${{ inputs.tf || '8,4,1' }}" | tr ',' ' '); do
            echo ""
            echo "##############################################"
            echo "#  TEMPO GRÁFICO: H$TF"
            echo "##############################################"
            python -u analise/explosao_final.py dados_universo \
              --tf "$TF" \
              --alvo "${{ inputs.alvo || '0.9' }}" \
              --faixas "${{ inputs.faixas || '4' }}" \
              --csv "explosao_universo_h$TF.csv"
          done 2>&1 | tee final.log

      - name: Guardar as planilhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operacoes
          path: explosao_universo_h*.csv
          if-no-files-found: ignore

      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -150 final.log; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY
