name: "pesquisa · Imagens dos últimos gatilhos da explosão de 8h"

# Desenha os ultimos gatilhos com dado fresco da Binance e COMMITA os
# PNG. O artefato do Actions nao e alcancavel do container de analise;
# pelo repositorio e um git pull.

on:
  workflow_dispatch:
    inputs:
      quantos:
        description: 'Quantos gatilhos desenhar'
        required: false
        default: '3'
      top:
        description: 'Quantos pares escanear'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  desenhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests matplotlib

      - name: Desenhar
        run: |
          set -o pipefail
          python -u analise/desenha_explosao8.py \
            --quantos ${{ inputs.quantos || '3' }} \
            --top ${{ inputs.top || '50' }} 2>&1 | tee imagens.log

      - name: Commitar as imagens
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d imagens_explosao8 ]; then git add -A imagens_explosao8; fi
          if git diff --cached --quiet; then
            echo "nenhuma imagem nova" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "imagens dos últimos gatilhos da explosão de 8h [skip ci]"
          for t in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep $((t * 4))
          done

      - name: Resumo
        if: always()
        run: |
          { echo '```'; cat imagens.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
