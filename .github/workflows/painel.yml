name: Painel mensal dos tres setups

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2020-01'
      ano:
        description: Ano do detalhamento mensal
        required: false
        default: '2026'

permissions:
  contents: write

jobs:
  pm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests matplotlib
      - name: Data de hoje
        id: dia
        run: echo "d=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - name: Cache dos klines
        uses: actions/cache@v4
        with:
          path: dados_universo
          key: universo-${{ inputs.inicio || '2020-01' }}-${{ steps.dia.outputs.d }}
          restore-keys: |
            universo-${{ inputs.inicio || '2020-01' }}-
      - name: Rodar
        run: |
          set -o pipefail
          python -u analise/painel_mensal.py dados_universo \
            --ano ${{ inputs.ano || '2026' }} 2>&1 | tee pm.log
      - name: Resumo
        if: always()
        run: |
          { echo '```'; cat pm.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
