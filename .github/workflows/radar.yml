name: Radar SMC (alertas)

# Escaneia a cesta e manda os gatilhos no Telegram.
# NAO opera -- e so radar para voce olhar o grafico.

on:
  schedule:
    # Logo apos o fechamento de cada vela de 15min (00/15/30/45).
    # Os minutos 2/17/32/47 fogem do topo da hora, onde a fila do Actions
    # e mais longa. O Actions AINDA assim atrasa -- ver nota no README.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      so_gatilho:
        description: 'Mandar só GATILHO (sem os avisos de RADAR)'
        required: false
        default: false
        type: boolean
      teste:
        description: 'Modo teste: imprime e não envia'
        required: false
        default: false
        type: boolean
      ping:
        description: 'Só manda uma mensagem de teste no Telegram'
        required: false
        default: false
        type: boolean
      tf_estrutura:
        description: 'Timeframe da estrutura'
        required: false
        default: '30m'
        type: choice
        options: ['30m', '1h', '15m']
      tf_gatilho:
        description: 'Timeframe do gatilho'
        required: false
        default: '15m'
        type: choice
        options: ['15m', '5m', '30m']
      rr_fixo:
        description: 'Alvo fixo (múltiplo de risco)'
        required: false
        default: '2.0'
      top:
        description: 'Quantos pares USDT de maior volume escanear (0 = lista fixa)'
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Escanear
        env:
          # aceita os dois padroes de nome de secret
          TELEGRAM_TOKEN: ${{ secrets.TOKEN_TELEGRAM || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID_TELEGRAM || secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          ARGS="--tf-estrutura ${{ inputs.tf_estrutura || '30m' }}"
          ARGS="$ARGS --tf-gatilho ${{ inputs.tf_gatilho || '15m' }}"
          ARGS="$ARGS --rr-fixo ${{ inputs.rr_fixo || '2.0' }}"
          ARGS="$ARGS --top ${{ inputs.top || '50' }}"
          [ "${{ inputs.so_gatilho }}" = "true" ] && ARGS="$ARGS --so-gatilho"
          [ "${{ inputs.teste }}" = "true" ] && ARGS="$ARGS --teste"
          [ "${{ inputs.ping }}" = "true" ] && ARGS="$ARGS --ping"
          python -u bot_alertas.py $ARGS 2>&1 | tee radar.log

      - name: Guardar o estado (evita alerta repetido)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A alertas_enviados.json diagnostico_telegram.txt resumo_radar.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: estado dos alertas [skip ci]"
          for t in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep $((t * 4))
          done

      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -30 radar.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
