name: "pesquisa · Reversão em 5 minutos"

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2023-01'
      top:
        description: 'Quantas moedas (as maiores)'
        required: false
        default: '215'
      ativos:
        description: 'Pares específicos (vazio = usa as maiores)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cinco:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Espaço em disco
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h / | tail -1
      - name: Data de hoje
        id: dia
        run: echo "d=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - name: Cache do 5m
        id: cache
        uses: actions/cache@v4
        with:
          path: dados_5m
          key: cinco5m-${{ inputs.top || '215' }}-${{ inputs.inicio || '2023-01' }}-${{ steps.dia.outputs.d }}
          restore-keys: cinco5m-${{ inputs.top || '215' }}-${{ inputs.inicio || '2023-01' }}-
      - name: Baixar 5m
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BAIXAR_THREADS: '16'
          ATIVOS: ${{ inputs.ativos }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "$ATIVOS" ]; then EXTRA="--ativos $ATIVOS"; fi
          python -u baixar_futuros.py --inicio ${{ inputs.inicio || '2023-01' }} \
            --intervalo 5m --top ${{ inputs.top || '215' }} --pasta dados_5m \
            $EXTRA 2>&1 | tail -8
      - name: O que tem
        run: |
          ls dados_5m | wc -l
          du -sh dados_5m
          df -h / | tail -1
      - name: Rodar
        env:
          ATIVOS: ${{ inputs.ativos }}
        run: |
          set -o pipefail
          python -u analise/reversao_5m.py dados_5m --ativos "$ATIVOS" \
            2>&1 | tee cinco.log
      - name: Resumo
        if: always()
        run: |
          { echo '```'; cat cinco.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
