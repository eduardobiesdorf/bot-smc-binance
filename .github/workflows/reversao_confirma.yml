name: Reversão com confirmação no H4 (universo inteiro)

# Padrao de reversao em H8, entrada refinada em H4 com varias
# confirmacoes. 2026 e o ano fora da amostra desta ideia: uma
# confirmacao so presta se deixar os DOIS anos positivos.

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2023-01'
      faixas:
        description: 'Em quantas faixas de volume dividir'
        required: false
        default: '4'
      corte:
        description: 'Volume mediano mínimo, em M USD/h (0 = todas)'
        required: false
        default: '0'
      entrada:
        description: 'Tempos gráficos da entrada, em horas'
        required: false
        default: '4,1'
      blocos:
        description: 'Cortes do ranking de volume'
        required: false
        default: '50,100,150,200,300'
      threads:
        description: 'Downloads em paralelo'
        required: false
        default: '16'

permissions:
  contents: read

jobs:
  confirma:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Baixar o universo inteiro em 1h
        env:
          BAIXAR_THREADS: ${{ inputs.threads || '16' }}
        run: |
          set -o pipefail
          python -u baixar_futuros.py \
            --inicio ${{ inputs.inicio || '2023-01' }} \
            --intervalo 1h --top 9999 --pasta dados_universo 2>&1 | tail -4
          echo "pares baixados: $(ls dados_universo | wc -l)"
      - name: Rodar
        run: |
          set -o pipefail
          python -u analise/reversao_confirma.py dados_universo \
            --faixas "${{ inputs.faixas || '4' }}" \
            --corte "${{ inputs.corte || '0' }}" \
            --entrada "${{ inputs.entrada || '4,1' }}" \
            --blocos "${{ inputs.blocos || '50,100,150,200,300' }}" \
            2>&1 | tee conf.log
      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -300 conf.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
