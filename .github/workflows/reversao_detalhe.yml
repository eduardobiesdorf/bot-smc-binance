name: Reversão validada — detalhe operação por operação

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2023-01'
      n:
        description: 'Quantas moedas (as N maiores por volume)'
        required: false
        default: '150'

permissions:
  contents: write

jobs:
  detalhe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Baixar
        env:
          BAIXAR_THREADS: '16'
        run: |
          set -o pipefail
          python -u baixar_futuros.py --inicio ${{ inputs.inicio || '2023-01' }} \
            --intervalo 1h --top 9999 --pasta dados_universo 2>&1 | tail -3
          echo "pares: $(ls dados_universo | wc -l)"
      - name: Rodar
        run: |
          set -o pipefail
          python -u analise/reversao_detalhe.py dados_universo \
            --n "${{ inputs.n || '150' }}" 2>&1 | tee detalhe.log
      - name: Commitar as planilhas
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in reversao_raso.csv reversao_raso_volume.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "operações da reversão validada [skip ci]"
          for t in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep $((t * 4))
          done
      - name: Resumo
        if: always()
        run: |
          { echo '```'; cat detalhe.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
