name: Backtest SMC H4

# Aba Actions -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Data inicial (YYYY-MM-DD)'
        required: true
        default: '2026-01-01'
      fim:
        description: 'Data final (vazio = hoje)'
        required: false
        default: ''
      modo:
        description: 'o que rodar'
        required: true
        default: 'filtros'
        type: choice
        options: [filtros, unica, montecarlo]
      custo_pct:
        description: 'Taxas + slippage por trade, em % do preco'
        required: false
        default: '0.10'
      extra:
        description: 'Flags extras (ex: --htf --premium --horas 12,16,20)'
        required: false
        default: ''

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Rodar
        run: |
          set -o pipefail
          ARGS="--inicio ${{ inputs.inicio }} --custo-pct ${{ inputs.custo_pct }}"
          [ -n "${{ inputs.fim }}" ] && ARGS="$ARGS --fim ${{ inputs.fim }}"
          case "${{ inputs.modo }}" in
            filtros)    ARGS="$ARGS --filtros" ;;
            montecarlo) ARGS="$ARGS --montecarlo 100 --mc-bloco 20" ;;
          esac
          python -u backtest_h4.py $ARGS ${{ inputs.extra }} 2>&1 | tee resultado.txt

      - name: Resumo no job
        if: always()
        run: |
          if [ -s resultado.txt ]; then
            { echo '```'; cat resultado.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          else
            echo '**resultado.txt VAZIO** - veja o log do passo "Rodar".' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-smc
          path: |
            resultado.txt
            trades_smc.csv
