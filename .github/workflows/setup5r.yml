name: "pesquisa · Setup 5 - universo rolante"

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial (YYYY-MM)'
        required: false
        default: '2020-01'
      n:
        description: 'Tamanho do universo por trimestre'
        required: false
        default: '150'
      so_universo:
        description: 'So a config do bot, variando o universo de 150 a 300'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  s5r:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests matplotlib
      - name: Data de hoje
        id: dia
        run: echo "d=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - name: Cache dos klines
        uses: actions/cache@v4
        with:
          path: dados_universo
          key: universo-${{ inputs.inicio || '2020-01' }}-${{ steps.dia.outputs.d }}
          restore-keys: |
            universo-${{ inputs.inicio || '2020-01' }}-
      - name: Rodar
        run: |
          set -o pipefail
          python -u analise/setup5_rolante.py dados_universo \
            --n ${{ inputs.n || '150' }} \
            ${{ inputs.so_universo == true && '--so-universo' || '' }} \
            2>&1 | tee s5r.log
      - name: Resumo
        if: always()
        run: |
          { echo '```'; cat s5r.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
