name: "pesquisa · teste: a API de futuros responde do Actions?"

# 18/11/2026 -- o bot ao vivo le SPOT (data-api.binance.vision) e o
# backteste foi validado em FUTUROS PERPETUOS. Sao mercados diferentes:
# preco, volume e lista de pares nao batem -- medido, 70% de sobreposicao.
#
# A correcao seria trocar a fonte para fapi.binance.com. Mas a Binance
# bloqueia essa API por geografia e os runners do GitHub ficam nos EUA.
# Este teste existe so para responder: passa ou nao passa?
#
# Nao varre nada, nao manda nada no Telegram. Menos de um minuto.

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rodar o teste
        run: |
          echo "=== de onde este runner sai ==="
          curl -s --max-time 15 https://ipinfo.io/json | head -c 300 || true
          echo
          echo
          echo "=== FUTUROS: fapi.binance.com ==="
          for par in \
            "ping=https://fapi.binance.com/fapi/v1/ping" \
            "klines=https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=3" \
            "ticker=https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT" \
            "info=https://fapi.binance.com/fapi/v1/exchangeInfo"
          do
            nome="${par%%=*}"
            url="${par#*=}"
            cod=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 25 "$url" || echo ERRO)
            tam=$(wc -c < /tmp/r.json 2>/dev/null || echo 0)
            echo "  $nome -> HTTP $cod ($tam bytes)"
            if [ "$cod" != "200" ]; then head -c 180 /tmp/r.json; echo; fi
          done
          echo
          echo "=== quantos perpetuos USDT, se o info passou ==="
          if [ -s /tmp/r.json ] && grep -q PERPETUAL /tmp/r.json 2>/dev/null; then
            n=$(grep -o '"contractType":"PERPETUAL"' /tmp/r.json | wc -l)
            echo "  contratos perpetuos no exchangeInfo: $n"
          else
            echo "  exchangeInfo nao veio -- nada a contar"
          fi
          echo
          echo "=== SPOT: o que o bot usa hoje (controle) ==="
          cods=$(curl -s -o /tmp/s.json -w '%{http_code}' --max-time 25 \
            "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=3" || echo ERRO)
          echo "  klines -> HTTP $cods"
