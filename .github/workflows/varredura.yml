name: Radar da varredura (H1)

# Escaneia os 150 pares USDT de maior volume procurando a varredura do
# order block, a reversao de 8h e o rompimento falso. NAO opera -- e radar
# para voce olhar o grafico.

on:
  schedule:
    # UM disparo a cada QUATRO horas: 00/04/08/12/16/20 UTC.
    #
    # Eram tres por hora (minutos 1, 11 e 21) para driblar a fila do
    # Actions; depois passou a um por hora. Medido em 220 execucoes: com
    # tres, o primeiro resultado da hora saia em 33 min (mediana); com um
    # so, sai em 43. A entrada e por ordem limitada valida 4h, entao nao
    # muda o resultado.
    #
    # 13/11/2026 -- passou para de 2 em 2 horas, porque a estimativa antiga
    # de ~1.540 min/mes estava baixa e o bot sozinho ja estourava a cota.
    #
    # 14/11/2026 -- passou para DE 4 EM 4 HORAS. Medido nas 452 rodadas de
    # novembro: 3,2 min por varredura, e o GitHub cobra arredondando para
    # cima, ou seja 4 min por rodada. De 2 em 2 horas eram 12 rodadas/dia =
    # 48 min/dia = ~1.440 min/mes; somando a pesquisa, novembro fechou em
    # 2.825 min contra 2.000 da cota gratuita de repositorio privado.
    # De 4 em 4 horas sao 6 rodadas/dia = 24 min/dia = ~720 min/mes.
    #
    # Nao perde fechamento nenhum: o setup 1 roda em H4 (fecha
    # 00/04/08/12/16/20 UTC, exatamente estas horas) e o setup 3 em H8
    # (fecha 00/08/16 UTC, um subconjunto). O custo e que o aviso de encosto
    # no order block e a atualizacao do stop movel saem a cada 4h em vez de
    # 2h.
    #
    # 14/11/2026, mais tarde -- o MINUTO saiu do :01 para o :37. O :01 e o
    # mais disputado do GitHub inteiro, todo mundo agenda na hora cheia.
    #
    # 16/11/2026 -- VOLTOU PARA DE 2 EM 2 HORAS, e nao por causa de minuto.
    # Medido de sabado 21h37 ate segunda 06h50: de 9 horarios esperados,
    # 4 dispararam (44%), com atraso de 36 min a 3h12. Trocar o minuto nao
    # resolveu nada: quem descarta e a fila do GitHub em repositorio
    # privado, e isso nao tem ajuste.
    #
    # A saida e redundancia, nao pontualidade: com 12 horarios por dia e
    # ~44% de aproveitamento saem ~5 varreduras/dia, que e perto da
    # cobertura que 6 horarios dariam se todos disparassem. Importa para o
    # setup 1, cuja entrada e ordem limitada valida 4h -- com buraco de 9h
    # nasce e morre entrada sem ninguem ver.
    #
    # Custo: ~1.440 min/mes em vez de ~720. O Eduardo preferiu pagar a
    # diferenca a ficar cego.
    #
    # Em Brasilia os disparos caem as 01h37, 03h37, 05h37 e assim por
    # diante, nas horas IMPARES. O GitHub ainda atrasa.
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      top:
        description: 'Quantos pares escanear na varredura (150 desde 14/11/2026)'
        required: false
        default: '150'
      fixo:
        description: 'Usar a lista fixa de 50 em vez do volume vivo'
        required: false
        default: false
        type: boolean
      rr_min:
        description: 'R:R mínimo para mandar o gatilho'
        required: false
        default: '1.2'
      vol_min:
        description: 'Volume mínimo da vela que varre (x a média de 20)'
        required: false
        default: '1.2'
      liq_max_r:
        description: 'Distância máxima da piscina de liquidez, em R'
        required: false
        default: '1.5'
      caixa:
        description: 'Banca em USDT, para calcular a mão'
        required: false
        default: '60'
      risco_pct:
        description: 'Quanto da banca morre num stop (%)'
        required: false
        default: '2'
      alav:
        description: 'Alavancagem máxima'
        required: false
        default: '8'
      so_gatilho:
        description: 'Mandar só GATILHO (sem os avisos de radar)'
        required: false
        default: false
        type: boolean
      teste:
        description: 'Modo teste: imprime e não envia'
        required: false
        default: false
        type: boolean
      exemplos:
        description: 'Com ping: quantos gatilhos do histórico mandar'
        required: false
        default: '2'
      novos:
        description: 'Com ping: só os pares que entraram em 01/11'
        required: false
        default: false
        type: boolean
      falha5_ping:
        description: 'Mandar amostra do quarto alerta (rompimento falso)'
        required: false
        default: false
        type: boolean
      falha5_exemplos:
        description: 'Quantos exemplos mandar com falha5_ping'
        required: false
        default: '2'
      sem_falha5:
        description: 'Desligar o quarto alerta (rompimento falso em H1, em teste)'
        required: false
        default: false
        type: boolean
      falha5_top:
        description: 'Quantas moedas o rompimento falso escaneia'
        required: false
        default: '150'
      sem_reversao8:
        description: 'Desligar o terceiro alerta (reversão de 8h, em teste)'
        required: false
        default: false
        type: boolean
      rev_top:
        description: 'Quantas moedas a reversão escaneia'
        required: false
        default: '150'
      rev8_ping:
        description: 'Mandar uma amostra do alerta da reversão de 8h'
        required: false
        default: false
        type: boolean
      rev8_exemplos:
        description: 'Quantos exemplos mandar com rev8_ping'
        required: false
        default: '2'
      explicar:
        description: 'Auditar um par (ex: ETHUSDT): mostra onde cada impulso foi recusado'
        required: false
        default: ''
      ping:
        description: 'Manda os últimos gatilhos do histórico, com gráfico'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requisitos.txt
      - run: pip install -r requisitos.txt

      - name: Escanear
        env:
          TELEGRAM_TOKEN: ${{ secrets.TOKEN_TELEGRAM || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID_TELEGRAM || secrets.TELEGRAM_CHAT_ID }}
          # Opcional: URL de um vigia externo (healthchecks.io e parecidos).
          # O bot bate nela a cada rodada; se o bot morrer de vez, o vigia
          # percebe a falta do sinal e avisa por fora do GitHub. Sem o
          # segredo, o bot simplesmente nao bate em nada.
          PING_VIGIA: ${{ secrets.PING_VIGIA }}
        run: |
          set -o pipefail
          ARGS="--top ${{ inputs.top || '150' }}"
          ARGS="$ARGS --rr-min ${{ inputs.rr_min || '1.2' }}"
          ARGS="$ARGS --vol-min ${{ inputs.vol_min || '1.2' }}"
          ARGS="$ARGS --liq-max-r ${{ inputs.liq_max_r || '1.5' }}"
          ARGS="$ARGS --caixa ${{ inputs.caixa || '60' }}"
          ARGS="$ARGS --risco-pct ${{ inputs.risco_pct || '2' }}"
          ARGS="$ARGS --alav ${{ inputs.alav || '8' }}"
          [ "${{ inputs.fixo }}" = "true" ] && ARGS="$ARGS --fixo"
          [ "${{ inputs.so_gatilho }}" = "true" ] && ARGS="$ARGS --so-gatilho"
          [ "${{ inputs.teste }}" = "true" ] && ARGS="$ARGS --teste"
          [ "${{ inputs.sem_reversao8 }}" = "true" ] && ARGS="$ARGS --sem-reversao8"
          [ "${{ inputs.sem_falha5 }}" = "true" ] && ARGS="$ARGS --sem-falha5"
          [ "${{ inputs.falha5_ping }}" = "true" ] && ARGS="$ARGS --falha5-ping"
          ARGS="$ARGS --falha5-exemplos ${{ inputs.falha5_exemplos || '2' }}"
          ARGS="$ARGS --falha5-top ${{ inputs.falha5_top || '150' }}"
          ARGS="$ARGS --rev-top ${{ inputs.rev_top || '150' }}"
          [ "${{ inputs.rev8_ping }}" = "true" ] && ARGS="$ARGS --rev8-ping"
          ARGS="$ARGS --rev8-exemplos ${{ inputs.rev8_exemplos || '2' }}"
          ARGS="$ARGS --exemplos ${{ inputs.exemplos || '2' }}"
          [ "${{ inputs.novos }}" = "true" ] && ARGS="$ARGS --novos"
          [ -n "${{ inputs.explicar }}" ] && ARGS="$ARGS --explicar ${{ inputs.explicar }}"
          [ "${{ inputs.ping }}" = "true" ] && ARGS="$ARGS --ping"
          python -u bot_varredura.py $ARGS 2>&1 | tee varredura.log

      - name: Guardar o estado (evita alerta repetido)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add aborta TUDO se um dos caminhos nao existe, e o
          # historico_ao_vivo.csv so nasce quando a primeira operacao
          # resolve. Resultado: nada era salvo desde 03/11. Adiciona um a um.
          for f in varredura_enviados.json acompanhamento.json \
                   ultima_rodada.json \
                   historico_ao_vivo.csv diagnostico_varredura.txt \
                   resumo_varredura.txt \
                   reversao8_estado.json \
                   historico_reversao8.csv \
                   falha5_estado.json \
                   historico_falha5.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nada mudou no estado" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "varredura: estado dos alertas [skip ci]"
          for t in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep $((t * 4))
          done

      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -40 varredura.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
