name: "00 · RODAR OS TRÊS DE UMA VEZ (manual)"

# Escaneia os 150 pares USDT de maior volume procurando a varredura do
# order block, a reversao de 8h e o rompimento falso. NAO opera -- e radar
# para voce olhar o grafico.

on:
  # 16/11/2026 -- SEM CRON. O agendamento mudou para um workflow por setup:
  # s1.yml (:05), s3.yml (:25) e s5.yml (:45). Este arquivo continua aqui
  # para DISPARO MANUAL, quando se quer rodar os tres de uma vez na mesma
  # serie de 1h baixada -- util para conferir tudo junto ou para os pings
  # de exemplo. Se voltar a ter cron, ele duplicaria o trabalho dos outros
  # tres (sem mandar alerta repetido, porque a trava por chave segura, mas
  # sem motivo).
  workflow_dispatch:
    inputs:
      top:
        description: 'Quantos pares escanear na varredura (150 desde 14/11/2026)'
        required: false
        default: '150'
      fixo:
        description: 'Usar a lista fixa de 50 em vez do volume vivo'
        required: false
        default: false
        type: boolean
      rr_min:
        description: 'R:R mínimo para mandar o gatilho'
        required: false
        default: '1.2'
      vol_min:
        description: 'Volume mínimo da vela que varre (x a média de 20)'
        required: false
        default: '1.2'
      liq_max_r:
        description: 'Distância máxima da piscina de liquidez, em R'
        required: false
        default: '1.5'
      caixa:
        description: 'Banca em USDT, para calcular a mão'
        required: false
        default: '60'
      risco_pct:
        description: 'Quanto da banca morre num stop (%)'
        required: false
        default: '2'
      alav:
        description: 'Alavancagem máxima'
        required: false
        default: '8'
      so_gatilho:
        description: 'Mandar só GATILHO (sem os avisos de radar)'
        required: false
        default: false
        type: boolean
      teste:
        description: 'Modo teste: imprime e não envia'
        required: false
        default: false
        type: boolean
      exemplos:
        description: 'Com ping: quantos gatilhos do histórico mandar'
        required: false
        default: '2'
      novos:
        description: 'Com ping: só os pares que entraram em 01/11'
        required: false
        default: false
        type: boolean
      falha5_ping:
        description: 'Mandar amostra do quarto alerta (rompimento falso)'
        required: false
        default: false
        type: boolean
      falha5_exemplos:
        description: 'Quantos exemplos mandar com falha5_ping'
        required: false
        default: '2'
      sem_falha5:
        description: 'Desligar o quarto alerta (rompimento falso em H1, em teste)'
        required: false
        default: false
        type: boolean
      falha5_top:
        description: 'Quantas moedas o rompimento falso escaneia'
        required: false
        default: '150'
      sem_reversao8:
        description: 'Desligar o terceiro alerta (reversão de 8h, em teste)'
        required: false
        default: false
        type: boolean
      rev_top:
        description: 'Quantas moedas a reversão escaneia'
        required: false
        default: '150'
      rev8_ping:
        description: 'Mandar uma amostra do alerta da reversão de 8h'
        required: false
        default: false
        type: boolean
      rev8_exemplos:
        description: 'Quantos exemplos mandar com rev8_ping'
        required: false
        default: '2'
      explicar:
        description: 'Auditar um par (ex: ETHUSDT): mostra onde cada impulso foi recusado'
        required: false
        default: ''
      ping:
        description: 'Manda os últimos gatilhos do histórico, com gráfico'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 16/11/2026 -- cancel-in-progress passou de false para TRUE. Com false a
# rodada nova ESPERAVA a antiga, e o GitHub so guarda uma na espera: com os
# atrasos de 2 a 3 horas dele, horario empilhava e sumia. Era inofensivo
# quando o cron era de 4 em 4 horas e virou suspeito quando apertou.
#
# Com true, a rodada nova cancela a velha presa na fila -- que e o certo
# para um radar: interessa a varredura de AGORA, nao a de tres horas atras.
# A cancelada ainda salva o estado, porque o passo "Guardar o estado" roda
# com if: always(). Sem isso, uma cancelada no meio mandaria alerta sem
# gravar a chave e o alerta repetiria na rodada seguinte.
concurrency:
  group: varredura
  cancel-in-progress: true

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requisitos.txt
      - run: pip install -r requisitos.txt

      - name: Escanear
        env:
          TELEGRAM_TOKEN: ${{ secrets.TOKEN_TELEGRAM || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID_TELEGRAM || secrets.TELEGRAM_CHAT_ID }}
          # Opcional: URL de um vigia externo (healthchecks.io e parecidos).
          # O bot bate nela a cada rodada; se o bot morrer de vez, o vigia
          # percebe a falta do sinal e avisa por fora do GitHub. Sem o
          # segredo, o bot simplesmente nao bate em nada.
          PING_VIGIA: ${{ secrets.PING_VIGIA }}
        run: |
          set -o pipefail
          # Workflow MANUAL: sem batimento. Ele so roda quando
          # alguem clica, entao mediria "buraco" de horas toda vez.
          ARGS="--sem-batimento --rotulo manual"
          ARGS="$ARGS --top ${{ inputs.top || '150' }}"
          ARGS="$ARGS --rr-min ${{ inputs.rr_min || '1.2' }}"
          ARGS="$ARGS --vol-min ${{ inputs.vol_min || '1.2' }}"
          ARGS="$ARGS --liq-max-r ${{ inputs.liq_max_r || '1.5' }}"
          ARGS="$ARGS --caixa ${{ inputs.caixa || '60' }}"
          ARGS="$ARGS --risco-pct ${{ inputs.risco_pct || '2' }}"
          ARGS="$ARGS --alav ${{ inputs.alav || '8' }}"
          [ "${{ inputs.fixo }}" = "true" ] && ARGS="$ARGS --fixo"
          [ "${{ inputs.so_gatilho }}" = "true" ] && ARGS="$ARGS --so-gatilho"
          [ "${{ inputs.teste }}" = "true" ] && ARGS="$ARGS --teste"
          [ "${{ inputs.sem_reversao8 }}" = "true" ] && ARGS="$ARGS --sem-reversao8"
          [ "${{ inputs.sem_falha5 }}" = "true" ] && ARGS="$ARGS --sem-falha5"
          [ "${{ inputs.falha5_ping }}" = "true" ] && ARGS="$ARGS --falha5-ping"
          ARGS="$ARGS --falha5-exemplos ${{ inputs.falha5_exemplos || '2' }}"
          ARGS="$ARGS --falha5-top ${{ inputs.falha5_top || '150' }}"
          ARGS="$ARGS --rev-top ${{ inputs.rev_top || '150' }}"
          [ "${{ inputs.rev8_ping }}" = "true" ] && ARGS="$ARGS --rev8-ping"
          ARGS="$ARGS --rev8-exemplos ${{ inputs.rev8_exemplos || '2' }}"
          ARGS="$ARGS --exemplos ${{ inputs.exemplos || '2' }}"
          [ "${{ inputs.novos }}" = "true" ] && ARGS="$ARGS --novos"
          [ -n "${{ inputs.explicar }}" ] && ARGS="$ARGS --explicar ${{ inputs.explicar }}"
          [ "${{ inputs.ping }}" = "true" ] && ARGS="$ARGS --ping"
          python -u bot_varredura.py $ARGS 2>&1 | tee varredura.log

      - name: Guardar o estado (evita alerta repetido)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add aborta TUDO se um dos caminhos nao existe, e o
          # historico_ao_vivo.csv so nasce quando a primeira operacao
          # resolve. Resultado: nada era salvo desde 03/11. Adiciona um a um.
          for f in varredura_enviados.json acompanhamento.json \
                   ultima_rodada.json \
                   historico_ao_vivo.csv diagnostico_varredura.txt \
                   resumo_varredura.txt \
                   reversao8_estado.json \
                   historico_reversao8.csv \
                   falha5_estado.json \
                   historico_falha5.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nada mudou no estado" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "varredura: estado dos alertas [skip ci]"
          for t in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep $((t * 4))
          done

      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -40 varredura.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
