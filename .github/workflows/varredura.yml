name: Radar da varredura (H1)

# Escaneia os 20 pares USDT de maior volume procurando a varredura do
# order block. NAO opera -- e radar para voce olhar o grafico.

on:
  schedule:
    # Logo apos o fechamento de cada vela de 1 hora. O minuto 7 foge do
    # topo da hora, onde a fila do Actions e mais longa.
    # Tres horarios por hora: o Actions atrasa de 25 a 45 min na conta
    # gratuita, e a fila de cada disparo e independente. Vale o primeiro
    # que executar -- o estado em varredura_enviados.json evita repetir.
    - cron: '1 * * * *'
    - cron: '11 * * * *'
    - cron: '21 * * * *'
  workflow_dispatch:
    inputs:
      top:
        description: 'Quantos pares escanear (da lista fixa de 20)'
        required: false
        default: '20'
      dinamico:
        description: 'Rankear por volume de 24h em vez da lista fixa'
        required: false
        default: false
        type: boolean
      rr_min:
        description: 'R:R mínimo para mandar o gatilho'
        required: false
        default: '1.2'
      so_gatilho:
        description: 'Mandar só GATILHO (sem os avisos de radar)'
        required: false
        default: false
        type: boolean
      teste:
        description: 'Modo teste: imprime e não envia'
        required: false
        default: false
        type: boolean
      exemplos:
        description: 'Com ping: quantos gatilhos do histórico mandar'
        required: false
        default: '2'
      ping:
        description: 'Manda os últimos gatilhos do histórico, com gráfico'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests matplotlib

      - name: Escanear
        env:
          TELEGRAM_TOKEN: ${{ secrets.TOKEN_TELEGRAM || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID_TELEGRAM || secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          ARGS="--top ${{ inputs.top || '20' }}"
          ARGS="$ARGS --rr-min ${{ inputs.rr_min || '1.2' }}"
          [ "${{ inputs.dinamico }}" = "true" ] && ARGS="$ARGS --dinamico"
          [ "${{ inputs.so_gatilho }}" = "true" ] && ARGS="$ARGS --so-gatilho"
          [ "${{ inputs.teste }}" = "true" ] && ARGS="$ARGS --teste"
          ARGS="$ARGS --exemplos ${{ inputs.exemplos || '2' }}"
          [ "${{ inputs.ping }}" = "true" ] && ARGS="$ARGS --ping"
          python -u bot_varredura.py $ARGS 2>&1 | tee varredura.log

      - name: Guardar o estado (evita alerta repetido)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A varredura_enviados.json diagnostico_varredura.txt resumo_varredura.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "varredura: estado dos alertas [skip ci]"
          for t in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep $((t * 4))
          done

      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -40 varredura.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
